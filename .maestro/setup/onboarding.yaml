appId: com.cashio.app.e2e
---
# This is a separate, disposable application ID. Never substitute com.cashio.app.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: 'Enable notification capture'
    timeout: 30000
- scrollUntilVisible:
    element: 'Continue'
- tapOn: 'Continue'
- scrollUntilVisible:
    element: 'Choose active accounts'
    direction: UP
- assertVisible: 'Choose active accounts'
- scrollUntilVisible:
    element: 'Continue'
- tapOn: 'Continue'
- scrollUntilVisible:
    element: 'Choose your base currency'
    direction: UP
- assertVisible: 'Choose your base currency'
- scrollUntilVisible:
    element: 'Continue'
- tapOn: 'Continue'
- assertVisible: 'You’re all set'
- tapOn: 'Start using Cashio'
- extendedWaitUntil:
    visible: 'Current balance'
    timeout: 30000
